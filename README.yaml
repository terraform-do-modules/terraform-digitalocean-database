  ```
  ## database replica example
  ```hcl
      module "redis" {
      source                       = "terraform-do-modules/database/digitalocean"
      version                      = "1.0.6"
      name                         = "app"
      environment                  = "test"
      region                       = "blr1"
      cluster_engine               = "mysql"
      cluster_version              = "8"
      cluster_size                 = "db-s-1vcpu-1gb"
      cluster_node_count           = 1
      cluster_private_network_uuid = module.vpc.id
      mysql_sql_mode               = "ANSI,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE,STRICT_ALL_TABLES,ALLOW_INVALID_DATES"
      cluster_maintenance = {
        maintenance_hour = "02:00:00"
        maintenance_day  = "saturday"
      }
      databases = ["testdb", "testdbt"]

      users = [
        {
          name              = "test1",
          mysql_auth_plugin = "mysql_native_password"
        }
      ]

      ## database replica
      replica_enable = true

      create_firewall = false
      firewall_rules = [
        {
          type  = "ip_addr"
          value = "0.0.0.0"
        }
      ]
    }
  ```

  ### Deploy with Terraform
  ```bash
  terraform init
  terraform plan
  terraform apply
  ```

  ### Deploy with OpenTofu
  ```bash
  tofu init
  tofu plan
  tofu apply
  ```

  ### Deploy with Terragrunt
  See [`examples/terragrunt/terragrunt.hcl`](./examples/terragrunt/terragrunt.hcl) for a complete example using DigitalOcean Spaces as remote state.
  ```bash
  export DIGITALOCEAN_TOKEN="<your-token>"
  export SPACES_ACCESS_KEY_ID="<your-spaces-key>"
  export SPACES_SECRET_ACCESS_KEY="<your-spaces-secret>"
  cd examples/terragrunt
  terragrunt init
  terragrunt plan
  terragrunt apply
  ```