description: |-
  Terraform module to create and manage Virtual Private Cloud on Digital Ocean.

usage : |-
  Here are examples of how you can use this module in your inventory structure:
  ### basic example
  ```hcl
      module "mysql" {
      source                       = "terraform-do-modules/database/digitalocean"
      version                      = "1.0.6"
      name                         = "app"
      environment                  = "test"
      region                       = "blr1"
      cluster_engine               = "redis"
      cluster_version              = "6"
      cluster_size                 = "db-s-1vcpu-1gb"
      cluster_node_count           = 1
      cluster_private_network_uuid = module.vpc.id
      redis_eviction_policy        = "volatile_lru"
      cluster_maintenance = {
        maintenance_hour = "02:00:00"
        maintenance_day  = "saturday"
      }
      create_firewall = false
      firewall_rules = [
        {
          type  = "ip_addr"
          value = "192.168.1.1"
        }
      ]
    }
  ```
  ## complete example
  ```hcl
      module "mysql" {
      source                       = "terraform-do-modules/database/digitalocean"
      version                      = "1.0.6"
      name                         = "app"
      environment                  = "test"
      region                       = "blr1"
      cluster_engine               = "mysql"
      cluster_version              = "8"
      cluster_size                 = "db-s-1vcpu-1gb"
      cluster_node_count           = 1
      cluster_private_network_uuid = module.vpc.id
      mysql_sql_mode               = "ANSI,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE,STRICT_ALL_TABLES,ALLOW_INVALID_DATES"
      cluster_maintenance = {
        maintenance_hour = "02:00:00"
        maintenance_day  = "saturday"
      }
      databases = ["testdb"]

      users = [
        {
          name              = "test",
          mysql_auth_plugin = "mysql_native_password"
        }
      ]

      create_firewall = false
      firewall_rules = [
        {
          type  = "ip_addr"
          value = "0.0.0.0"
        }
      ]
    }
  ```
  ## mongodb example
  ```hcl
