      mysql_sql_mode               = "ANSI,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE,STRICT_ALL_TABLES,ALLOW_INVALID_DATES"
      cluster_maintenance = {
        maintenance_hour = "02:00:00"
        maintenance_day  = "saturday"
      }
      databases = ["testdb"]

      users = [
        {
          name              = "test",
          mysql_auth_plugin = "mysql_native_password"
        }
      ]

      create_firewall = false
      firewall_rules = [
        {
          type  = "ip_addr"
          value = "0.0.0.0"
        }
      ]
    }
  ```
  ## postgresql example
  ```hcl
      module "postgresql" {
      source                       = "terraform-do-modules/database/digitalocean"
      version                      = "1.0.6"
      name                         = "app"
      environment                  = "test"
      region                       = "blr1"
      cluster_engine               = "pg"
      cluster_version              = "15"
      cluster_size                 = "db-s-1vcpu-1gb"
      cluster_node_count           = 1
      cluster_private_network_uuid = module.vpc.id
      cluster_maintenance = {
        maintenance_hour = "02:00:00"
        maintenance_day  = "saturday"
      }
      databases = ["testdb"]
      users = [
        {
          name = "test"
        }
      ]

      create_pools = true
      pools = [
        {
          name    = "test",
          mode    = "transaction",
          size    = 10,
          db_name = "testdb",
          user    = "test"
        }
      ]

      create_firewall = false
      firewall_rules = [
        {
          type  = "ip_addr"
          value = "0.0.0.0"
        }
      ]
    }
  ```
  ## redis example
